# Training defaults
training:
  epochs: 300
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.05
  warmup_epochs: 20
  label_smoothing: 0.1
  mixup_alpha: 0.8
  cutmix_alpha: 1.0
  optimizer: adamw

data:
  dataset: cifar10
  num_workers: 4
  pin_memory: true

checkpoint:
  save_every: 10
  save_dir: checkpoints/
